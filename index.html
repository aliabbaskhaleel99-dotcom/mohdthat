        let activeCategoryId = 1;
        let globalPlaybackSpeed = 1.0;
        let femaleVoice = null;

        // --- WEB SPEECH SYNTHESIS ENGINE ---
        function initVoiceEngine() {
            if (!('speechSynthesis' in window) || typeof window.SpeechSynthesisUtterance === 'undefined') {
                updateVoiceStatus("سيُستخدم مشغل الصوت الاحتياطي عبر الإنترنت", true);
                return;
            }

            function loadVoices() {
                const voices = window.speechSynthesis.getVoices();
                if (voices.length === 0) {
                    updateVoiceStatus("جارٍ تحميل الأصوات الألمانية…", true);
                    return;
                }

                // Priority filter for German Female Voice
                const germanVoices = voices.filter(v => v.lang.startsWith('de'));
                
                // Search specifically for female voice indicators in names
                femaleVoice = germanVoices.find(v => 
                    /female|hedda|marlene|vicki|katja|gudrun|petra|zira|karen|helena/i.test(v.name)
                ) || germanVoices.find(v => v.lang === 'de-DE') || germanVoices[0];

                if (femaleVoice) {
                    updateVoiceStatus(`الصوت المفعل: ${femaleVoice.name} (أنثوي ألماني)`, true);
                } else if (voices.length > 0) {
                    updateVoiceStatus("صوت قياسي افتراضي (de)", true);
                }
            }

            loadVoices();
            if (speechSynthesis.onvoiceschanged !== undefined) {
                speechSynthesis.onvoiceschanged = loadVoices;
            }
        }

        // لا توجد نافذة حالة للصوت؛ تبقى الواجهة خالية من إشعارات التشغيل.
        function updateVoiceStatus() {}

        // تشغيل النطق: Web Speech أولاً، مع مشغل احتياطي للأجهزة/المتصفحات التي لا تدعمه.
        let fallbackAudio = null;
        function speakText(text, onEndCallback = null) {
            const phrase = String(text || '').trim();
            if (!phrase) return;
            if (window.speechSynthesis && typeof window.SpeechSynthesisUtterance !== 'undefined') {
                try {
                    window.speechSynthesis.cancel();
                    const utterance = new SpeechSynthesisUtterance(phrase);
                    utterance.lang = 'de-DE';
                    utterance.rate = globalPlaybackSpeed;
                    const voices = window.speechSynthesis.getVoices();
                    if (!femaleVoice && voices.length) {
                        const german = voices.filter(v => /^de([_-]|$)/i.test(v.lang));
                        femaleVoice = german.find(v => /female|hedda|marlene|vicki|katja|gudrun|petra|helena/i.test(v.name))
                            || german.find(v => /^de[-_]DE$/i.test(v.lang)) || german[0] || null;
                    }
                    if (femaleVoice) utterance.voice = femaleVoice;
                    showToast(phrase, femaleVoice ? `الصوت: ${femaleVoice.name}` : 'النطق الألماني');
                    let completed = false;
                    const done = () => {
                        if (completed) return;
                        completed = true;
                        hideToast();
                        if (onEndCallback) onEndCallback();
                    };
                    utterance.onend = done;
                    utterance.onerror = (e) => {
                        console.warn('Speech synthesis error:', e && e.error);
                        // لا نستخدم الاحتياطي عند الإلغاء المتعمد.
                        if (e && e.error === 'canceled') return;
                        playFallbackAudio(phrase, globalPlaybackSpeed, onEndCallback);
                    };
                    window.speechSynthesis.speak(utterance);
                    return;
                } catch (err) {
                    console.warn('Speech synthesis unavailable:', err);
                }
            }
            playFallbackAudio(phrase, globalPlaybackSpeed, onEndCallback);
        }

        function playFallbackAudio(phrase, speed = 1, onEndCallback = null) {
            try {
                if (fallbackAudio) {
                    fallbackAudio.pause();
                    fallbackAudio.src = '';
                }
                // خدمة نطق احتياطية عبر الإنترنت؛ تتطلب اتصالاً بالإنترنت.
                fallbackAudio = new Audio('https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=de&q=' + encodeURIComponent(phrase));
                fallbackAudio.playbackRate = Math.max(0.5, Math.min(1.5, Number(speed) || 1));
                showToast(phrase, 'نطق ألماني احتياطي عبر الإنترنت');
                fallbackAudio.onended = () => {
                    hideToast();
                    if (onEndCallback) onEndCallback();
                };
                fallbackAudio.onerror = () => {
                    hideToast();
                    updateVoiceStatus('تعذر تشغيل الصوت؛ جرّب Chrome مع اتصال بالإنترنت', false);
                };
                const playPromise = fallbackAudio.play();
                if (playPromise && playPromise.catch) playPromise.catch(err => {
                    console.warn('Fallback audio error:', err);
                    hideToast();
                    updateVoiceStatus('تعذر تشغيل الصوت؛ تحقق من المتصفح والإنترنت', false);
                });
            } catch (err) {
                console.warn('Fallback audio unavailable:', err);
                updateVoiceStatus('الصوت غير متاح في هذا المتصفح', false);
            }
        }

        // --- UI TOAST NOTIFICATION ---
        // تم إلغاء مستطيل إشعار الصوت؛ التشغيل يعمل دون إشعارات منبثقة.
        function showToast() {}
        function hideToast() {}

        // --- RENDER FUNCTIONS ---
        function renderCategoryList(filterQuery = "") {
            const container = document.getElementById('categoryList');
            container.innerHTML = "";

            categoriesData.forEach(cat => {
                if (filterQuery) {
                    const matchTitle = cat.title.toLowerCase().includes(filterQuery.toLowerCase());
                    const matchAr = cat.titleAr.includes(filterQuery);
                    const matchItem = cat.items.some(i => i.de.toLowerCase().includes(filterQuery.toLowerCase()) || i.ar.includes(filterQuery));
                    if (!matchTitle && !matchAr && !matchItem) return;
                }

                const isActive = cat.id === activeCategoryId;
                const btn = document.createElement('button');
                btn.className = `w-full text-right px-3 py-2.5 rounded-xl flex items-center justify-between transition text-xs font-semibold ${
                    isActive 
                        ? 'bg-rose-50 text-rose-700 border border-rose-200 shadow-sm' 
                        : 'text-slate-600 hover:bg-slate-50 hover:text-slate-900'
                }`;

                btn.onclick = () => {
                    activeCategoryId = cat.id;
                    renderCategoryList(filterQuery);
                    renderActiveCategory();
                    // Close sidebar on mobile
                    document.getElementById('sidebar').classList.add('translate-x-full');
                    const backdrop = document.getElementById('sidebarBackdrop'); if (backdrop) backdrop.classList.add('hidden');
                };

                btn.innerHTML = `
                    <div class="flex items-center gap-2.5 min-w-0">
                        <span class="w-6 h-6 rounded-lg ${isActive ? 'bg-rose-600 text-white' : 'bg-slate-100 text-slate-500'} flex items-center justify-center text-[10px] font-bold shrink-0">
                            ${cat.id}
                        </span>
                        <div class="truncate">
                            <span class="block text-slate-900 font-bold truncate">${cat.title}</span>
                            <span class="block text-[11px] text-slate-400 font-normal truncate">${cat.titleAr}</span>
                        </div>
                    </div>
                    <i data-lucide="chevron-left" class="w-4 h-4 text-slate-400 shrink-0"></i>
                `;
                container.appendChild(btn);
            });

            lucide.createIcons();
        }

        function renderActiveCategory() {
            const cat = categoriesData.find(c => c.id === activeCategoryId) || categoriesData[0];
            document.getElementById('categoryNumber').innerText = `محادثة ${cat.id} من ${categoriesData.length}`;
            document.getElementById('categoryTitle').innerText = `${cat.title} (${cat.titleAr})`;
            document.getElementById('categorySubtitle').innerText = cat.desc;
            document.getElementById('categoryIcon').setAttribute('data-lucide', cat.icon || 'message-circle');
            const grid = document.getElementById('vocabGrid');
            grid.className = "grid grid-cols-1 gap-4";
            grid.innerHTML = "";
            cat.items.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = "bg-white rounded-2xl p-4 sm:p-5 shadow-sm border border-slate-200/80 hover:shadow-md transition";
                const safeDe = item.de.replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/\\n/g, ' ');
                card.innerHTML = `
                    <div class="flex flex-col gap-2">
                      <div class="flex items-start gap-3">
                        <span class="shrink-0 inline-flex items-center justify-center w-8 h-8 rounded-full bg-rose-100 text-rose-700 font-extrabold text-sm">${index+1}</span>
                        <div class="flex-1 min-w-0">
                          <p class="de-text text-lg sm:text-xl font-bold text-slate-900 leading-relaxed">${item.de}</p>
                          <p class="text-sm sm:text-base text-slate-600 mt-1 leading-relaxed">${item.ar}</p>
                        </div>
                      </div>
                      <div class="flex justify-end pt-2 border-t border-slate-100">
                        <button onclick="speakText('${safeDe}')" class="inline-flex items-center gap-2 px-4 py-2 bg-rose-600 hover:bg-rose-700 text-white rounded-xl shadow-sm transition text-sm font-bold" aria-label="استمع إلى السطر ${index+1}">
                          <i data-lucide="volume-2" class="w-4 h-4"></i><span>استمع إلى السطر</span>
                        </button>
                      </div>
                    </div>`;
                grid.appendChild(card);
            });
            lucide.createIcons();
        }

        // --- تشغيل المحادثة بالتتابع مع إمكانية الإيقاف والاستئناف ---
        let sequencePlaying = false;
        let sequenceIndex = 0;
        let sequenceCategoryId = null;
        let sequenceTimer = null;

        function updatePlayAllButton(playing) {
            const btn = document.getElementById('playAllBtn');
            if (!btn) return;
            btn.innerHTML = playing
                ? '<i data-lucide="square" class="w-4 h-4 text-rose-600"></i><span>إيقاف تشغيل المحادثة</span>'
                : '<i data-lucide="play-circle" class="w-4 h-4 text-rose-600"></i><span>استماع إلى المحادثة بالتتابع</span>';
            btn.setAttribute('aria-pressed', playing ? 'true' : 'false');
            lucide.createIcons();
        }

        function stopSequentialPlayback(reset = true) {
            sequencePlaying = false;
            if (sequenceTimer) { clearTimeout(sequenceTimer); sequenceTimer = null; }
            if (window.speechSynthesis) window.speechSynthesis.cancel();
            if (fallbackAudio) { try { fallbackAudio.pause(); fallbackAudio.currentTime = 0; } catch (e) {} }
            if (reset) { sequenceIndex = 0; sequenceCategoryId = null; }
            updatePlayAllButton(false);
        }

        function playAllCategoryItems() {
            if (sequencePlaying) {
                stopSequentialPlayback(true);
                return;
            }
            const cat = categoriesData.find(c => c.id === activeCategoryId) || categoriesData[0];
            if (!cat || !cat.items || !cat.items.length) return;
            sequencePlaying = true;
            sequenceIndex = 0;
            sequenceCategoryId = cat.id;
            updatePlayAllButton(true);

            function playNext() {
                if (!sequencePlaying) return;
                const currentCat = categoriesData.find(c => c.id === sequenceCategoryId);
                if (!currentCat || sequenceIndex >= currentCat.items.length) {
                    stopSequentialPlayback(true);
                    return;
                }
                const item = currentCat.items[sequenceIndex];
                sequenceIndex++;
                speakText(item.de, () => {
                    if (!sequencePlaying) return;
                    sequenceTimer = setTimeout(playNext, 500);
                });
            }
            playNext();
        }

        // --- EVENT LISTENERS ---
        document.addEventListener('DOMContentLoaded', () => {
            initVoiceEngine();
            renderCategoryList();
            renderActiveCategory();

            // Mobile Menu
            const sidebar = document.getElementById('sidebar');
            const sidebarBackdrop = document.getElementById('sidebarBackdrop');
            const openPages = () => { sidebar.classList.remove('translate-x-full'); sidebarBackdrop.classList.remove('hidden'); };
            const closePages = () => { sidebar.classList.add('translate-x-full'); sidebarBackdrop.classList.add('hidden'); };
            document.getElementById('mobileMenuBtn').onclick = openPages;
            document.getElementById('closeSidebarBtn').onclick = closePages;
            sidebarBackdrop.onclick = closePages;

            // Category Search
            document.getElementById('categorySearch').oninput = (e) => {
                renderCategoryList(e.target.value);
            };

            // Speed Selector Buttons: the chosen value is used for every next pronunciation.
            document.querySelectorAll('.speed-btn').forEach((btn) => {
                btn.addEventListener('click', function () {
                    const chosenSpeed = Number(this.getAttribute('data-speed'));
                    if (!Number.isFinite(chosenSpeed) || chosenSpeed < 0.5 || chosenSpeed > 1.5) return;

                    globalPlaybackSpeed = chosenSpeed;

                    document.querySelectorAll('.speed-btn').forEach((button) => {
                        button.classList.remove('active-speed', 'bg-rose-600', 'text-white', 'shadow-sm');
                        button.classList.add('text-slate-600');
                        button.setAttribute('aria-pressed', 'false');
                    });

                    this.classList.remove('text-slate-600');
                    this.classList.add('active-speed', 'bg-rose-600', 'text-white', 'shadow-sm');
                    this.setAttribute('aria-pressed', 'true');
                });
            });

            // Play All Button
            document.getElementById('playAllBtn').onclick = playAllCategoryItems;
        });
    </script>
</body>
</html>
